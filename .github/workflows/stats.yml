name: Generate GitHub Stats

on:
  schedule:
    - cron: "30 18 * * *" # 03:30 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone and start github-readme-stats
        run: |
          git clone --depth 1 https://github.com/anuraghazra/github-readme-stats.git /tmp/stats
          cd /tmp/stats
          npm install
          PAT_1=${{ secrets.PAT_TOKEN }} node express.js &
          sleep 5

      - name: Generate stats SVGs
        run: |
          mkdir -p stats

          DARK="hide_border=true&bg_color=0D1117&title_color=00FF00&text_color=FFFFFF"
          LIGHT="hide_border=true&bg_color=FFFFFF&title_color=0B8A3E&text_color=24292F"

          # GitHub Stats Card
          curl -s "http://localhost:9000/api?username=cruway&show_icons=true&theme=radical&$DARK&icon_color=00FF00&include_all_commits=true&count_private=true" -o stats/github-stats.svg
          curl -s "http://localhost:9000/api?username=cruway&show_icons=true&$LIGHT&icon_color=0B8A3E&ring_color=0B8A3E&include_all_commits=true&count_private=true" -o stats/github-stats-light.svg

          # Top Languages
          curl -s "http://localhost:9000/api/top-langs/?username=cruway&layout=compact&theme=radical&$DARK&langs_count=10" -o stats/top-langs.svg
          curl -s "http://localhost:9000/api/top-langs/?username=cruway&layout=compact&$LIGHT&langs_count=10" -o stats/top-langs-light.svg

      - name: Generate streak stats
        run: |
          set +e
          # $1 = output path, $2 = theme query. Keeps the previous SVG whenever the
          # upstream API is down or hands back one of its error cards.
          fetch_streak() {
            curl -sf --retry 3 --retry-delay 10 \
              "https://streak-stats.demolab.com/?user=cruway&hide_border=true&$2" \
              -o "$1.new"
            status=$?
            if [ $status -eq 0 ] \
              && grep -q '<svg' "$1.new" \
              && ! grep -qi 'Failed to retrieve\|API issue\|Sad' "$1.new"; then
              mv "$1.new" "$1"
              echo "updated $1"
            else
              echo "streak-stats fetch failed or returned error svg; keeping previous $1"
              rm -f "$1.new"
            fi
          }

          fetch_streak stats/streak.svg "theme=radical&background=0D1117&stroke=00FF00&ring=00FF00&fire=FF6600&currStreakLabel=00FF00"
          fetch_streak stats/streak-light.svg "background=FFFFFF&stroke=0B8A3E&ring=0B8A3E&fire=FF6600&currStreakLabel=0B8A3E&sideLabels=24292F&dates=57606A&sideNums=24292F&currStreakNum=24292F&excludeDaysLabel=57606A"

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add stats/
          git commit -m "generated player stats" || { echo "nothing to commit"; exit 0; }
          # Sibling workflows push to main on overlapping schedules, so a plain
          # push races with them. Rebase onto whatever landed and try again.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected; rebasing onto origin/main (attempt $attempt)"
            git pull --rebase origin main || exit 1
          done
          echo "push still failing after 3 attempts"
          exit 1
