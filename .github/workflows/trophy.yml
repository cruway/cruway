name: Generate Trophy Hall

# The hosted github-profile-trophy.vercel.app instance returns 402
# (DEPLOYMENT_DISABLED), so the trophy SVGs are rendered here instead —
# same self-hosting approach as .github/workflows/stats.yml.

on:
  schedule:
    - cron: "45 18 * * *" # 03:45 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Generate trophy (dark)
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: stats/trophy-dark.svg
          theme: matrix
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate trophy (light)
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: ${{ github.repository_owner }}
          output_path: stats/trophy-light.svg
          theme: flat
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add stats/
          git commit -m "generated trophy hall" || { echo "nothing to commit"; exit 0; }
          # Sibling workflows push to main on overlapping schedules, so a plain
          # push races with them. Rebase onto whatever landed and try again.
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push rejected; rebasing onto origin/main (attempt $attempt)"
            git pull --rebase origin main || exit 1
          done
          echo "push still failing after 3 attempts"
          exit 1
